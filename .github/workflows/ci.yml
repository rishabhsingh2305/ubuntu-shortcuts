name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Static checks
        run: ./test/lint.sh

      - name: Isolated installer test
        run: ./test/install_test.sh
